# Central settings. Change values here instead of editing code.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed

input:
  file: null            # e.g. data/raw/dataset.csv (or pass --input on the CLI)

bigquery:               # optional; project comes from GCP_PROJECT_ID in .env
  query: null           # SQL to use as the input instead of a file (or pass --query)
  destination_table: null  # e.g. my_dataset.output; also load results here (or --bq-table)
  write_disposition: WRITE_TRUNCATE  # or WRITE_APPEND
  max_bytes_billed: 1000000000  # ~1 GB cost guard per query

validate:
  required_columns: []  # fill in once the dataset is known
  allow_empty: false

transform:
  drop_duplicates: true

output:
  file: data/processed/output.csv

medallion:              # ShopSphere pipeline: python -m hackathon.medallion
  input_dir: data/raw/Ecommerce_Analytics_SourceData/Ecommerce_Analytics_SourceData
  db_path: data/processed/shopsphere.db
  batch_id: batch_001
  reference_date: null  # YYYY-MM-DD; null = latest order date in the data (never today)
  return_rate_min_volume: 10   # min ordered units before a product return rate is reported
  payment_tolerance: 1.00      # allowed gap between paid and order total
  repeat_window_days: 90       # repeat-purchase window
  bq_dataset: null             # e.g. shopsphere_gold; null = no BigQuery load (or --bq-dataset)
  bq_location: US              # dataset location, used when the dataset is created

kpis:
  db_path: data/processed/shopsphere.db
  output_dir: reports/kpi_outputs
